_schema-version: 3.3.0
ID: dealerdiscountapproval
version: 1.0.0
description: "Pricing and Dealer Discount Approval"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: dealerdiscountapproval-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: dealerdiscountapproval-db
      - name: dealerdiscountapproval-auth

  - name: dealerdiscountapproval-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: dealerdiscountapproval-db
  - name: dealerdiscountapproval
    type: approuter.nodejs
    path: .deploy/app-router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: dealerdiscountapproval-auth
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: dealerdiscountapproval-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: dealerdiscountapproval-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: dealerdiscountapproval-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'PricingAnalyst (dealerdiscountapproval ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.PricingAnalyst'
          - name: 'DealerSalesUser (dealerdiscountapproval ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.DealerSalesUser'
          - name: 'RegionalManager (dealerdiscountapproval ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.RegionalManager'
          - name: 'FinanceApprover (dealerdiscountapproval ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.FinanceApprover'
          - name: 'PricingAdministrator (dealerdiscountapproval ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.PricingAdministrator'
    requires:
      - name: app-api
